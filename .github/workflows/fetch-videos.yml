name: Fetch Latest Videos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Run video fetch script
        run: |
          if [ -f fetch-videos.js ]; then node fetch-videos.js; fi
          if [ -f fetch_videos.py ]; then python fetch_videos.py; fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit and push updated videos.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update video cache [skip ci]" && git push)
