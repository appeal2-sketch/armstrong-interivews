const fs = require('fs');
const path = require('path');

// Target Search Config
const SEARCH_QUERY = 'Martin Armstrong interview';
const API_KEY = process.env.YOUTUBE_API_KEY;

const jsonPath = path.join(__dirname, '../../videos.json');
const xmlPath = path.join(__dirname, '../../feed.xml');

async function fetchLatestVideos() {
  if (!API_KEY) {
    console.error("Missing YOUTUBE_API_KEY environment variable.");
    process.exit(1);
  }

  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(SEARCH_QUERY)}&type=video&order=date&maxResults=15&key=${API_KEY}`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    if (!data.items) {
      console.log("No videos returned or API quota exceeded.", data);
      return;
    }

    // Read existing videos.json cache
    let existingVideos = [];
    if (fs.existsSync(jsonPath)) {
      existingVideos = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
    }

    const existingIds = new Set(existingVideos.map(v => v.id));
    const newEntries = [];

    data.items.forEach(item => {
      const videoId = item.id.videoId;
      if (!existingIds.has(videoId)) {
        newEntries.push({
          id: videoId,
          title: item.snippet.title,
          host: item.snippet.channelTitle,
          date: new Date(item.snippet.publishedAt).toISOString().split('T')[0],
          url: `https://www.youtube.com/watch?v=${videoId}`
        });
      }
    });

    if (newEntries.length === 0) {
      console.log("No new videos found. Cache is up to date.");
      return;
    }

    // Append new entries to top of master list
    const updatedVideos = [...newEntries, ...existingVideos];

    // Write updated videos.json
    fs.writeFileSync(jsonPath, JSON.stringify(updatedVideos, null, 2));
    console.log(`Successfully added ${newEntries.length} new videos to videos.json!`);

    // Generate feed.xml for Mailchimp
    generateRSSFeed(updatedVideos);

  } catch (err) {
    console.error("Error executing YouTube fetch script:", err);
  }
}

function generateRSSFeed(videos) {
  const latestTen = videos.slice(0, 10);

  const rssItems = latestTen.map(v => `
    <item>
      <title><![CDATA[${v.title}]]></title>
      <link>${v.url}</link>
      <guid>${v.id}</guid>
      <pubDate>${new Date(v.date).toUTCString()}</pubDate>
      <description><![CDATA[Watch the latest interview featuring Martin Armstrong on ${v.host}.]]></description>
    </item>
  `).join('');

  const rssXml = `<?xml version="1.0" encoding="UTF-8" ?>
<rss version="2.0">
  <channel>
    <title>Armstrong Interviews Archive</title>
    <link>https://armstronginterviews.com</link>
    <description>Latest Martin Armstrong video interviews and Economic Confidence Model cycle updates.</description>
    ${rssItems}
  </channel>
</rss>`;

  fs.writeFileSync(xmlPath, rssXml);
  console.log("Successfully generated feed.xml for Mailchimp!");
}

fetchLatestVideos();name: Fetch Latest Videos & Sync RSS

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants GitHub Actions write access to update videos.json and feed.xml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/node-setup@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Fetch Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node .github/scripts/fetch-videos.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update video archive and RSS feed [skip ci]" && git push)
